  <text x="90" y="335" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Data, &amp; Scholarly Insights.</text>

  <text x="90" y="385" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">
