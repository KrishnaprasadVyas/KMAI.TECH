<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05080E"/>
      <stop offset="1" stop-color="#0E1A2C"/>
    </linearGradient>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgP)"/>
  <circle cx="200" cy="200" r="180" fill="#006EFF" opacity="0.1" filter="url(#glowP)"/>

  <!-- Browser Frame -->
  <rect x="50" y="45" width="1100" height="660" rx="14" fill="#091320" stroke="#162E4F" stroke-width="1.5"/>
  <rect x="50" y="45" width="1100" height="48" rx="14" fill="#0D1D34"/>
  <circle cx="78" cy="69" r="6" fill="#FF5F56"/>
  <circle cx="100" cy="69" r="6" fill="#FFBD2E"/>
  <circle cx="122" cy="69" r="6" fill="#27C93F"/>
  
  <rect x="280" y="56" width="640" height="26" rx="6" fill="#050C16" stroke="#142B49"/>
