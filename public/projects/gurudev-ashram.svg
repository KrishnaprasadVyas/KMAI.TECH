<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0E1E38"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14284B" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0B172E" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#006EFF"/>
      <stop offset="1" stop-color="#1683FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgG)"/>

  <!-- Ambient Glow -->
  <circle cx="850" cy="200" r="180" fill="#006EFF" opacity="0.18" filter="url(#glow)"/>
