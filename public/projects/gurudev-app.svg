<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040813"/>
      <stop offset="1" stop-color="#0B172B"/>
    </linearGradient>
    <linearGradient id="appG" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0F1E38"/>
      <stop offset="1" stop-color="#08101E"/>
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgA)"/>
  <circle cx="600" cy="400" r="280" fill="#006EFF" opacity="0.12" filter="url(#glowA)"/>

  <!-- Left Info Column -->
  <text x="80" y="140" fill="#006EFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">MOBILE APP ECOSYSTEM</text>
  <text x="80" y="195" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800">Shri Gurudev</text>
  <text x="80" y="240" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800">Ashram App</text>
  <text x="80" y="295" fill="#8EA3BF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Built with React Native, Expo Router, and Supabase.</text>
  <text x="80" y="320" fill="#8EA3BF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Empowers devotees and authorized field collectors</text>
  <text x="80" y="345" fill="#8EA3BF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">with real-time yatra passes, seva booking &amp; sync.</text>

  <rect x="80" y="400" width="220" height="70" rx="10" fill="#0A162A" stroke="#162E52"/>
  <text x="100" y="428" fill="#6A85A8" font-family="'JetBrains Mono', monospace" font-size="11">ACTIVE USERS</text>
  <text x="100" y="455" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">5,000+ Active</text>

  <rect x="80" y="490" width="220" height="70" rx="10" fill="#0A162A" stroke="#162E52"/>
  <text x="100" y="518" fill="#6A85A8" font-family="'JetBrains Mono', monospace" font-size="11">FRAMEWORK</text>
  <text x="100" y="545" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Expo / React Native</text>

  <!-- Two Mobile Devices in Center/Right -->
  <!-- Device 1: Devotee Feed -->
  <g transform="translate(420, 60)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="310" height="620" rx="36" fill="#000000" stroke="#1E3863" stroke-width="4"/>
    <rect x="10" y="10" width="290" height="600" rx="28" fill="url(#appG)"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="100" y="18" width="90" height="18" rx="9" fill="#000000"/>
    
    <!-- App Status Bar -->
    <text x="35" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">9:41</text>
    
    <!-- App Header -->
    <text x="30" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Gurudev Seva</text>
    <circle cx="260" cy="70" r="16" fill="#173155"/>
    <text x="260" y="74" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">KV</text>

    <!-- Daily Darshan Card -->
    <rect x="25" y="100" width="240" height="150" rx="14" fill="#0E213E" stroke="#1A3A69"/>
    <text x="45" y="130" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">TODAY'S SATSANG</text>
    <text x="45" y="155" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Live Aarti &amp; Pravachan</text>
    <text x="45" y="178" fill="#89A3C2" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Broadcast begins at 6:30 PM IST</text>
    <rect x="45" y="198" width="100" height="30" rx="6" fill="#006EFF"/>
    <text x="95" y="217" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Join Stream ▶</text>

    <!-- Yatra Pass Widget -->
    <rect x="25" y="270" width="240" height="120" rx="14" fill="#09182D" stroke="#163156"/>
    <text x="45" y="300" fill="#A0A7B1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">VERIFIED YATRA PASS</text>
    <text x="45" y="325" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Kedarnath Darshan Batch #4</text>
    <rect x="45" y="345" width="70" height="24" rx="4" fill="#14532D"/>
    <text x="80" y="361" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">CONFIRMED</text>

    <!-- Quick Seva Icons -->
    <rect x="25" y="410" width="70" height="70" rx="12" fill="#0A1A31" stroke="#18345C"/>
    <text x="60" y="450" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Donations</text>
    
    <rect x="110" y="410" width="70" height="70" rx="12" fill="#0A1A31" stroke="#18345C"/>
    <text x="145" y="450" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pooja</text>

    <rect x="195" y="410" width="70" height="70" rx="12" fill="#0A1A31" stroke="#18345C"/>
    <text x="230" y="450" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Receipts</text>

    <!-- Bottom Tab Bar -->
    <rect x="10" y="550" width="290" height="60" rx="0" fill="#060C16"/>
    <circle cx="65" cy="575" r="4" fill="#006EFF"/>
    <circle cx="145" cy="575" r="4" fill="#475569"/>
    <circle cx="225" cy="575" r="4" fill="#475569"/>
  </g>

  <!-- Device 2: Collector Workflow -->
  <g transform="translate(780, 100)">
    <rect x="0" y="0" width="310" height="620" rx="36" fill="#000000" stroke="#1E3863" stroke-width="4"/>
    <rect x="10" y="10" width="290" height="600" rx="28" fill="url(#appG)"/>
    
    <rect x="100" y="18" width="90" height="18" rx="9" fill="#000000"/>
    <text x="35" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">9:41</text>
    
    <text x="30" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Collector Portal</text>
    <rect x="190" y="60" width="75" height="24" rx="4" fill="#1E3A8A"/>
    <text x="227" y="76" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">OFFLINE OK</text>

    <!-- Collected Total -->
    <rect x="25" y="100" width="240" height="110" rx="12" fill="#0C1F3B" stroke="#1D4073"/>
    <text x="45" y="128" fill="#7896BB" font-family="'JetBrains Mono', monospace" font-size="10">BATCH RECONCILIATION</text>
    <text x="45" y="165" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">₹ 1,42,800</text>
    <text x="45" y="190" fill="#A0A7B1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">48 Receipts Synced to Cloud</text>

    <!-- Recent Entries -->
    <rect x="25" y="230" width="240" height="55" rx="8" fill="#071324" stroke="#142B49"/>
    <text x="40" y="255" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Ramesh K. Patel</text>
    <text x="40" y="272" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#REC-9082 • 80G Issued</text>
    <text x="210" y="262" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">₹ 5,100</text>

    <rect x="25" y="295" width="240" height="55" rx="8" fill="#071324" stroke="#142B49"/>
    <text x="40" y="320" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Sunita S. Sharma</text>
    <text x="40" y="337" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">#REC-9083 • 80G Issued</text>
    <text x="210" y="327" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">₹ 11,000</text>

    <!-- Issue Receipt Button -->
    <rect x="25" y="375" width="240" height="48" rx="8" fill="#006EFF"/>
    <text x="145" y="405" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">+ Generate Instant 80G</text>
  </g>
</svg>
